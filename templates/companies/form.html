{% extends "base/base.html" %}
{% block title %}{{ action }} Company — TradePlatform{% endblock %}
{% block nav_companies %}active{% endblock %}
{% block page_title %}{{ action }} Company{% endblock %}
{% block content %}
<form method="post">
{% csrf_token %}
<div style="display:grid;grid-template-columns:2fr 1fr;gap:20px;align-items:start;">
    <div class="card">
        <div class="card-header"><h2>Company Information</h2></div>
        <div class="card-body">
            <div class="form-grid form-grid-2">
                <div class="form-group" style="grid-column:span 2;">
                    <label>Company Name *</label>
                    <input type="text" name="name" class="form-control" value="{% if company %}{{ company.name }}{% endif %}" required>
                </div>
                <div class="form-group">
                    <label>Type</label>
                    <select name="company_type" class="form-control">
                        <option value="customer" {% if not company or company.company_type == 'customer' %}selected{% endif %}>Customer</option>
                        <option value="vendor" {% if company and company.company_type == 'vendor' %}selected{% endif %}>Vendor</option>
                        <option value="both" {% if company and company.company_type == 'both' %}selected{% endif %}>Both</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Default Currency</label>
                    <select name="default_currency" class="form-control">
                        <option value="USD" {% if not company or company.default_currency == 'USD' %}selected{% endif %}>USD</option>
                        <option value="EUR" {% if company and company.default_currency == 'EUR' %}selected{% endif %}>EUR</option>
                        <option value="GBP" {% if company and company.default_currency == 'GBP' %}selected{% endif %}>GBP</option>
                        <option value="AED" {% if company and company.default_currency == 'AED' %}selected{% endif %}>AED</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Payment Terms</label>
                    <input type="text" name="payment_terms" class="form-control" value="{% if company %}{{ company.payment_terms }}{% endif %}" placeholder="Net 30, prepayment...">
                </div>
                <div class="form-group">
                    <label>Tax ID</label>
                    <input type="text" name="tax_id" class="form-control" value="{% if company %}{{ company.tax_id }}{% endif %}">
                </div>
                <div class="form-group">
                    <label>Credit Limit</label>
                    <input type="number" name="credit_limit" class="form-control" value="{% if company and company.credit_limit %}{{ company.credit_limit }}{% endif %}" step="0.01" placeholder="0.00">
                </div>
                <div class="form-group" style="grid-column:span 2;">
                    <label>Billing Address</label>
                    <textarea name="billing_address" class="form-control">{% if company %}{{ company.billing_address }}{% endif %}</textarea>
                </div>
                <div class="form-group" style="grid-column:span 2;">
                    <label>Shipping Address</label>
                    <textarea name="shipping_address" class="form-control">{% if company %}{{ company.shipping_address }}{% endif %}</textarea>
                </div>
                <div class="form-group" style="grid-column:span 2;">
                    <label>Internal Notes</label>
                    <textarea name="internal_notes" class="form-control">{% if company %}{{ company.internal_notes }}{% endif %}</textarea>
                </div>
            </div>
        </div>
    </div>
    <div class="card" style="position:sticky;top:70px;">
        <div class="card-header"><h2>Actions</h2></div>
        <div class="card-body" style="display:flex;flex-direction:column;gap:10px;">
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Company</button>
            <a href="/companies/" class="btn btn-secondary">Cancel</a>
        </div>
    </div>
</div>
</form>
{% endblock %}
